- id: pydantic-settings-export
  name: pydantic-settings-export
  description: "Export your Pydantic settings to Markdown and .env.example files!"
  entry: pydantic-settings-export
  language: python
  files: \.py$
  args: [ ]
  pass_filenames: false
  additional_dependencies: [ ]
  stages: [ pre-commit ]
- id: pydantic-settings-export-check
  name: pydantic-settings-export (check)
  description: "Check that files generated from your Pydantic settings are up to date, without writing them."
  entry: pydantic-settings-export --check
  language: python
  files: \.py$
  args: [ ]
  pass_filenames: false
  additional_dependencies: [ ]
  stages: [ pre-commit ]
